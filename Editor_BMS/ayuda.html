<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<title>Ayuda y menús · Falcon BMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14191F; --panel:#1C232B; --panel2:#222B35; --line:#2C3640;
  --text:#E6EBF0; --dim:#8A96A3; --acc:#F2A900; --ok:#4CC38A; --bad:#F06A6A; --sel:#38B6FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:54px}
header h1{font-size:15px;font-weight:600;margin:0 6px 0 0;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.grow{flex:1}
button{background:#26303A;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4A5663}
button.pri{background:var(--acc);border-color:var(--acc);color:#14191F;font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=search],textarea{background:#11161B;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit}
#q{width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12px;background:#1A2129;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#14191F;font-weight:600}
.seg button b{font-weight:400;opacity:.75;margin-left:4px}
#avisos{padding:0 16px}
#avisos div{margin-top:8px;padding:8px 12px;border:1px solid #5a4512;background:#2a2312;border-radius:6px;font-size:12px;color:#E8D9B0}
main{display:grid;grid-template-columns:1fr 290px;min-height:0}
#left{display:flex;flex-direction:column;min-width:0;min-height:0}
#tblWrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);z-index:2}
tbody td{padding:3px 10px;border-bottom:1px solid #1E262E;vertical-align:middle}
tbody tr:hover td{background:#181F27}
td.id{color:var(--dim);font:11px Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.te{font-size:11px;color:#B9C4CF}
td.en{color:#B9C4CF;cursor:copy;overflow:hidden;text-overflow:ellipsis}
td.en.una{white-space:nowrap}
td.es input,td.es textarea{width:100%;background:transparent;border:1px solid transparent;color:var(--text);padding:5px 7px;border-radius:4px;font:inherit;resize:vertical}
td.es input:hover,td.es textarea:hover{border-color:var(--line)}
td.es input:focus,td.es textarea:focus{outline:none;border-color:var(--sel);background:#11161B}
tr.mod td.es input,tr.mod td.es textarea{color:var(--acc)}
tr.badv td.es input,tr.badv td.es textarea{border-color:var(--bad);color:var(--bad)}
td.st{font-size:11px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;margin:1px 4px 1px 0;border:1px solid var(--line);color:var(--dim)}
.tag.com{color:#9ccff0;border-color:#2b4a5e}
.tag.her{color:#C9A0FF;border-color:#4b3a66;cursor:help}
.tag.bad{color:var(--bad);border-color:#5e2b2b}
.tag.warn{color:var(--acc);border-color:#5a4512;cursor:help}
.tag.mod{color:#14191F;background:var(--acc);border-color:var(--acc)}
#pager{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.box{background:#11161B;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:#B9C4CF;margin-bottom:14px;line-height:1.5}
.box b{color:var(--text)}
.fl{font-size:12px;margin-bottom:16px}
.fl div{padding:5px 0;border-bottom:1px solid #26303A}
.dim{color:var(--dim)}
#log{font-size:12px;white-space:pre-wrap;color:#B9C4CF}
#veil{position:fixed;inset:0;background:rgba(5,8,11,.72);display:none;align-items:center;justify-content:center;z-index:100;font-size:14px}
#veil div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 26px;min-width:320px}
.menu{position:relative}
.pop{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:50;min-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px}
.pop button:hover{background:#2C3846}
.vacio{color:var(--dim);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1><i></i>Ayuda y menús</h1>
  <div class="seg" id="vsel">
    <button data-v="lck" class="on" title="Textos de la interfaz (LckTxtRc.irc): comunes a todos los teatros y propios de cada uno">Interfaz<b id="nLck"></b></button>
    <button data-v="guia" title="Guía de la interfaz (Art\Help\GuideTxt.irc)">Guía<b id="nGuia"></b></button>
    <button data-v="ayuda" title="Ayudas emergentes (Art\Help\HelpText.irc)">Ayuda<b id="nAyuda"></b></button>
    <button data-v="menu" title="Menú de radio de la cabina (Art\CkptArt\Menu.dat)">Menú de radio<b id="nMenu"></b></button>
  </div>
  <div class="seg" id="filtros">
    <button data-f="todos" class="on">Todos<b id="cTodos"></b></button>
    <button data-f="com" title="Mismo inglés en todos los teatros: va en el LckTxtRc.irc común">Comunes<b id="cCom"></b></button>
    <button data-f="prop" title="Propios de uno o varios teatros: van en su fichero de cambios">Propios<b id="cProp"></b></button>
    <button data-f="igual" title="La traducción es igual que el inglés">Sin traducir<b id="cIgual"></b></button>
    <button data-f="mod" title="Cambiados y sin guardar">Cambiados<b id="cMod"></b></button>
  </div>
  <input id="q" type="search" placeholder="Buscar por ID o texto…">
  <div class="grow"></div>
  <div class="menu"><button id="bExp" class="sm" title="Exportar los textos de las cuatro vistas para trabajarlos fuera (Excel, traductor automático…)">Exportar ▾</button>
    <div id="mExp" class="pop">
      <button data-x="csv">Todo, con la traducción actual (.csv para Excel/LibreOffice)</button>
      <button data-x="falta">Lo que falta por traducir, en inglés (.txt para traductor)</button>
      <button data-x="txt">Todo en inglés (.txt para traductor)</button>
    </div></div>
  <button id="bImp" class="sm" title="Cargar un .csv o .txt exportado (y traducido) desde aquí">Importar</button>
  <input type="file" id="fImp" accept=".txt,.csv,.tsv" hidden>
  <button id="bDes" disabled>Deshacer todo</button>
  <button id="bSave" class="pri" disabled>Guardar</button>
</header>
<div id="avisos"></div>
<main id="main">
  <div id="left">
    <div id="tblWrap">
      <table>
        <colgroup><col id="colId" style="width:200px"><col id="colTe" style="width:150px"><col style="width:36%"><col><col style="width:130px"></colgroup>
        <thead><tr><th>ID</th><th id="thTe">Teatros</th><th>Inglés (original)</th><th>Traducción</th><th>Estado</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="pager"><button class="sm" id="pPrev">◀</button><span id="pInfo"></span><button class="sm" id="pNext">▶</button><span class="grow"></span><span id="sum"></span></div>
  </div>
  <aside>
    <h3>Ficheros</h3>
    <div class="fl" id="fl" data-noi18n></div>
    <h3>Ayuda</h3>
    <div class="box" id="ayudaTxt" data-noi18n></div>
    <h3>Registro</h3>
    <div id="log" data-noi18n></div>
  </aside>
</main>
<div id="veil"><div id="veilTxt"></div></div>
<script>
'use strict';
const K = new URLSearchParams(location.search).get('k') || '';
const $ = id => document.getElementById(id);
const api = (p, q) => 'api/' + p + '?' + new URLSearchParams(Object.assign({ k: K }, q || {}));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const log = t => { const d = $('log'); d.textContent = new Date().toLocaleTimeString() + '  ' + t + '\n' + d.textContent; };
const veil = t => { $('veil').style.display = t ? 'flex' : 'none'; $('veilTxt').textContent = t || ''; };
const TT = s => window.BMS_I18N ? BMS_I18N.T(s) : s;
const tick = () => new Promise(r => setTimeout(r, 0));

// ---------- Windows-1252 ----------
const HI = '€\u0081‚ƒ„…†‡ˆ‰Š‹Œ\u008DŽ\u008F\u0090‘’“”•–—˜™š›œ\u009DžŸ';
const dec = b => { let s = ''; for (const c of b) s += c >= 0x80 && c < 0xa0 ? HI[c - 0x80] : String.fromCharCode(c); return s; };
const U8 = new TextDecoder('utf-8', { fatal: true });
const desMojibake = s => s.replace(/[\u00c2-\u00f4][\u0080-\u00bf\u0152\u0153\u0160\u0161\u0178\u017d\u017e\u0192\u02c6\u02dc\u2013\u2014\u2018-\u201e\u2020-\u2022\u2026\u2030\u2039\u203a\u20ac\u2122]{1,3}/g, m => {
  const b = []; for (const ch of m){ const c = ch.charCodeAt(0); if (c < 0x100) b.push(c); else { const j = HI.indexOf(ch); if (j < 0) return m; b.push(0x80 + j); } }
  try { const r = U8.decode(new Uint8Array(b)); return r.length === 1 ? r : m; } catch(e){ return m; } });
function enc(str){ const a = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); if (c < 0x80 || (c >= 0xa0 && c < 0x100)) a[i] = c; else { const j = HI.indexOf(str[i]); if (j < 0) return null; a[i] = 0x80 + j; } }
  return a; }
// ---------- .irc: [ADDTEXT] ID "texto" ----------
const IRC_RE = /^([ \t]*\[ADDTEXT\][ \t]+(\S+)[ \t]+")([^"\r\n]*)(")/gm;
function leerIrc(t){ const m = new Map(), orden = []; let x; IRC_RE.lastIndex = 0; while ((x = IRC_RE.exec(t))) if (!m.has(x[2])){ m.set(x[2], x[3]); orden.push(x[2]); } return { m, orden }; }
function escribirIrc(t, cambios){
  const h = new Set(); IRC_RE.lastIndex = 0;
  let out = t.replace(IRC_RE, (m, a, id, v, c) => { if (cambios.has(id) && !h.has(id)){ h.add(id); return a + cambios.get(id) + c; } return m; });
  const faltan = [...cambios].filter(([id]) => !h.has(id));
  if (faltan.length){ if (out && !/\n$/.test(out)) out += '\r\n'; out += faltan.map(([id, v]) => `[ADDTEXT] ${id} "${v}"`).join('\r\n') + '\r\n'; }
  return out;
}
// ---------- Menu.dat: #menu / #page / #item, el texto es lo último de la línea ----------
const MENU_RE = /^((?:#menu(?:[ \t]+\S+){5}|#page(?:[ \t]+\S+){3}|#item(?:[ \t]+\S+){5})[ \t]+)([^\r\n]*?)([ \t]*)(?=\r?\n|(?![\s\S]))/gm;
function leerMenu(t){ const L = []; let x, menu = '', pag = ''; MENU_RE.lastIndex = 0;
  while ((x = MENU_RE.exec(t))){ const tipo = x[1].slice(1, 5); L.push({ tipo, v: x[2] }); } return L; }
function escribirMenu(t, cambios){ let i = -1; MENU_RE.lastIndex = 0; return t.replace(MENU_RE, (m, a, v, b) => { i++; return cambios.has(i) ? a + cambios.get(i) + b : m; }); }

const VISTAS = {
  lck:   { ayuda: 'Textos de la interfaz: <b>LckTxtRc.irc</b>. Los <b>comunes</b> (mismo inglés en todos los teatros) van en el LckTxtRc.irc de la traducción; los <b>propios</b> van en el fichero de cambios del teatro (<b>Cambios_TEATRO.irc</b>), que el instalador pone encima. «Usa el común» = ese teatro tiene otro inglés pero hoy muestra la traducción común.<br>Sin comillas ni saltos de línea.' },
  guia:  { ayuda: 'Guía de la interfaz: <b>Art\\Help\\GuideTxt.irc</b>. Sin comillas ni saltos de línea.' },
  ayuda: { ayuda: 'Ayudas emergentes: <b>Art\\Help\\HelpText.irc</b>. Sin comillas ni saltos de línea.' },
  menu:  { ayuda: 'Menú de radio de la cabina: <b>Art\\CkptArt\\Menu.dat</b> (el mismo para todos los teatros). Solo se cambia el texto de cada línea <b>#menu</b>, <b>#page</b> e <b>#item</b>. La traducción actual no usa tildes ni eñes: la fuente del menú de radio puede no tenerlas.' },
};
let INFO = null, D = {}, ROWS = [], VIEW = [], VISTA = 'lck', FILTRO = 'todos', PAGE = 0;
const PER = 200;

async function bajar(url){ const r = await fetch(url); return r.ok ? dec(new Uint8Array(await r.arrayBuffer())) : null; }

async function init(){
  try { INFO = await (await fetch(api('info'))).json(); } catch(e){ log('No se pudo cargar: ' + e.message); return; }
  const avisos = [];
  // ---- LckTxtRc ----
  veil(TT('Leyendo') + ' LckTxtRc.irc…'); await tick();
  const L = { te: INFO.lck || [], base: null, cam: {}, en: {}, enRel: {} };
  if (INFO.lckBase){
    L.baseTxt = await bajar(api('lck', { que: 'base' })); L.base = leerIrc(L.baseTxt || '');
    for (const t of L.te){
      L.camTxt = L.camTxt || {}; L.camTxt[t.clave] = t.cambios ? await bajar(api('lck', { que: 'cambios', t: t.clave })) : null;
      L.cam[t.clave] = leerIrc(L.camTxt[t.clave] || '').m;
      // el original en inglés: el primero de sus rutas que no sea en realidad una traducción
      for (const rel of t.rels){
        const x = await bajar(api('lck', { que: 'en', t: t.clave, rel })); if (x == null) continue;
        const m = leerIrc(desMojibake(x)).m; let ac = 0, ig = 0;
        for (const [id, v] of L.base.m) if (/[áéíóúñ¿¡]/i.test(v)){ ac++; if (m.get(id) === v) ig++; }
        if (ac && ig / ac > 0.3){ avisos.push(`${TT('El original en inglés de')} <b>${esc(rel)}</b> ${TT('(Data_ORIGINAL) es en realidad una traducción; se usa otro.')}`); continue; }
        L.en[t.clave] = m; L.enRel[t.clave] = rel; break;
      }
      if (!L.en[t.clave] && L.en.COREA){ L.en[t.clave] = L.en.COREA; avisos.push(`<b>${esc(t.nombre)}</b>: ${TT('sin original en inglés del LckTxtRc.irc; se usa el de Corea.')}`); }
    }
  } else if (L.te.length) avisos.push(TT('No se encuentra el LckTxtRc.irc de la traducción en Archivos.csv: la vista Interfaz queda vacía.'));
  D.lck = L;
  // ---- GuideTxt / HelpText ----
  for (const [k, rel] of [['guia', INFO.guia], ['ayuda', INFO.ayuda]]){
    if (!rel){ D[k] = null; continue; }
    veil(TT('Leyendo') + ' ' + rel + '…'); await tick();
    const ed = await bajar(api('file', { rel, src: 'ed' })), en = await bajar(api('file', { rel, src: 'en' }));
    D[k] = { rel, txt: ed || '', ed: leerIrc(ed || ''), en: en != null ? leerIrc(desMojibake(en)).m : null };
  }
  // ---- Menu.dat (uno para todos los teatros) ----
  if (INFO.menu && INFO.menu.length){
    veil(TT('Leyendo') + ' Menu.dat…'); await tick();
    const rel = INFO.menu[0].rel, ed = await bajar(api('file', { rel, src: 'ed' })), en = await bajar(api('file', { rel, src: 'en' }));
    const E = leerMenu(ed || ''), N = en != null ? leerMenu(desMojibake(en)) : null;
    if (N && N.length !== E.length) avisos.push(TT('Menu.dat: la traducción y el original no tienen las mismas líneas de texto; se emparejan por orden.'));
    D.menu = { rels: INFO.menu.map(x => x.rel), txt: ed || '', E, N };
  } else D.menu = null;
  veil('');
  $('avisos').innerHTML = avisos.map(x => `<div>⚠ ${x}</div>`).join('');
  construir(); pintarFicheros(); poner(VISTA);
  if (window.parent !== window) window.parent.postMessage({ tipo: 'listo', modulo: 'ayu' }, location.origin);
}

// filas de todas las vistas
function construir(){
  ROWS = [];
  const L = D.lck;
  if (L.base){
    const ids = [...L.base.orden]; const vis = new Set(ids);
    for (const t of L.te){ for (const id of (L.en[t.clave] || new Map()).keys()) if (!vis.has(id)){ vis.add(id); ids.push(id); } for (const id of L.cam[t.clave].keys()) if (!vis.has(id)){ vis.add(id); ids.push(id); } }
    for (const id of ids){
      const g = new Map();
      for (const t of L.te){
        const en = L.en[t.clave] ? L.en[t.clave].get(id) : undefined, ov = L.cam[t.clave].get(id), bv = L.base.m.get(id);
        if (en === undefined && ov === undefined && bv === undefined) continue;
        const k = (en ?? '\u0000') + '\u0001' + (ov !== undefined ? 'c' + ov : 'b');
        if (!g.has(k)) g.set(k, { vista: 'lck', id, en: en ?? null, te: [], ov: ov !== undefined, base: ov !== undefined ? ov : (bv ?? '') });
        g.get(k).te.push(t.clave);
      }
      for (const r of g.values()){
        r.esBase = !r.ov && r.te.includes('COREA');
        r.hereda = !r.ov && !r.esBase && L.base.m.has(id);
        r.com = r.te.length === L.te.length;
        r.xid = 'L:' + id + ':' + r.te[0];
        ROWS.push(r);
      }
    }
  }
  for (const k of ['guia', 'ayuda']){ const d = D[k]; if (!d) continue;
    for (const id of d.ed.orden) ROWS.push({ vista: k, id, en: d.en ? (d.en.get(id) ?? null) : null, base: d.ed.m.get(id), com: true, xid: (k === 'guia' ? 'G:' : 'H:') + id });
  }
  // Menu.dat: las líneas con el mismo inglés (la misma orden en varios menús) van en una sola fila
  if (D.menu){ let menu = '', pag = ''; const G = new Map();
    D.menu.E.forEach((x, i) => { const en = D.menu.N && D.menu.N[i] ? D.menu.N[i].v : null;
      if (x.tipo === 'menu'){ menu = en || x.v; pag = ''; } if (x.tipo === 'page') pag = en || x.v;
      const ctx = x.tipo === 'menu' ? TT('(título del menú)') : menu + (x.tipo === 'item' ? ' › ' + pag : '');
      const k = en != null && /\S/.test(en) ? 'E' + en : '#' + i;
      let r = G.get(k);
      if (!r){ r = { vista: 'menu', tipos: new Set(), ns: [], ctxs: [], en, cnt: new Map(), com: true, xid: 'M:' + i }; G.set(k, r); ROWS.push(r); }
      r.tipos.add('#' + x.tipo); r.ns.push(i); r.ctxs.push(ctx); r.cnt.set(x.v, (r.cnt.get(x.v) || 0) + 1);
    });
    for (const r of G.values()){
      r.id = [...r.tipos].join(' / '); r.ctx = r.ctxs[0];
      r.base = [...r.cnt].sort((a, b) => b[1] - a[1])[0][0]; r.var = r.cnt.size > 1; r.forzar = false;
    }
  }
  for (const r of ROWS){ r.val = r.base; r.k = norm(r.id + '\u0001' + (r.en || '') + '\u0001' + (r.cnt ? [...r.cnt.keys()].join('\u0001') : r.base) + '\u0001' + (r.ctxs ? r.ctxs.join('\u0001') : '')); }
  for (const v of ['lck', 'guia', 'ayuda', 'menu']){ const n = ROWS.filter(r => r.vista === v).length; $('n' + v[0].toUpperCase() + v.slice(1)).textContent = n || ''; }
}
function pintarFicheros(){
  const L = D.lck, h = [];
  if (L.base) h.push(`<div><b>LckTxtRc.irc</b> · ${esc(TT('común'))}<br><span class="dim">${L.te.map(t => esc(t.nombre) + (t.cambios ? ' + Cambios_' + esc(t.clave) + '.irc' : '') + (L.enRel[t.clave] ? '' : ' · ' + esc(TT('sin inglés')))).join('<br>')}</span></div>`);
  for (const k of ['guia', 'ayuda']) if (D[k]) h.push(`<div><b>${esc(D[k].rel)}</b><br><span class="dim">${D[k].ed.orden.length} ${esc(TT('textos'))}${D[k].en ? '' : ' · ' + esc(TT('sin original en inglés'))}</span></div>`);
  if (D.menu) h.push(`<div><b>Menu.dat</b><br><span class="dim">${D.menu.rels.map(esc).join('<br>')}</span></div>`);
  $('fl').innerHTML = h.join('') || `<div class="dim">${esc(TT('No hay ficheros de ayuda ni menús.'))}</div>`;
}
function estado(r){
  const bad = enc(r.val) == null || /[\r\n]/.test(r.val) || (r.vista !== 'menu' && r.val.includes('"'));
  const igual = r.en != null && r.val === r.en && /[a-z]{3}/i.test(r.en);
  return { mod: r.val !== r.base || !!r.forzar, bad, igual, tilde: r.vista === 'menu' && /[áéíóúüñÁÉÍÓÚÜÑ¿¡]/.test(r.val) };
}
function poner(v){
  VISTA = v; document.querySelectorAll('#vsel button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  const lck = v === 'lck';
  $('thTe').textContent = TT(lck ? 'Teatros' : v === 'menu' ? 'Contexto' : ''); $('colTe').style.width = lck || v === 'menu' ? '170px' : '0';
  $('colId').style.width = v === 'menu' ? '90px' : '200px';
  for (const f of ['com', 'prop']) document.querySelector(`#filtros button[data-f=${f}]`).style.display = lck ? '' : 'none';
  if (!lck && (FILTRO === 'com' || FILTRO === 'prop')){ FILTRO = 'todos'; document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x.dataset.f === 'todos')); }
  $('ayudaTxt').innerHTML = TT(VISTAS[v].ayuda);
  filtrar();
}
function filtrar(){
  const q = norm($('q').value.trim()), c = { todos: 0, com: 0, prop: 0, igual: 0, mod: 0 };
  VIEW = [];
  for (const r of ROWS){
    if (r.vista !== VISTA) continue;
    const s = estado(r);
    c.todos++; if (r.com) c.com++; else c.prop++; if (s.igual) c.igual++; if (s.mod) c.mod++;
    if (FILTRO === 'com' && !r.com) continue; if (FILTRO === 'prop' && r.com) continue;
    if (FILTRO === 'igual' && !s.igual) continue; if (FILTRO === 'mod' && !s.mod) continue;
    if (q && !r.k.includes(q) && !norm(r.val).includes(q)) continue;
    VIEW.push(r);
  }
  for (const k of Object.keys(c)){ const el = $('c' + k[0].toUpperCase() + k.slice(1)); if (el) el.textContent = c[k]; }
  PAGE = 0; pintar(); botones();
}
const NOMBRES = () => Object.fromEntries((D.lck.te || []).map(t => [t.clave, t.nombre]));
function fila(r, i){
  const s = estado(r), N = NOMBRES();
  let st = '';
  if (s.mod) st += `<span class="tag mod">${esc(TT('cambiado'))}</span>`;
  if (s.bad) st += `<span class="tag bad" title="${esc(TT('Comillas, saltos de línea o caracteres que no admite el juego'))}">${esc(TT('no válido'))}</span>`;
  if (s.tilde) st += `<span class="tag warn" title="${esc(TT('La fuente del menú de radio puede no tener tildes ni eñes'))}">${esc(TT('tilde'))}</span>`;
  if (r.var && !r.forzar && r.val === r.base) st += `<span class="tag warn" title="${esc([...r.cnt].map(([t, n]) => n + '×  ' + t).join('\n'))}">${r.cnt.size} ${esc(TT('variantes'))}</span> <button class="sm" data-unif="1">${esc(TT('Unificar'))}</button>`;
  if (r.hereda) st += `<span class="tag her" title="${esc(TT('Este teatro tiene otro texto en inglés, pero hoy usa la traducción común. Si lo cambias, se guarda en su fichero de cambios.'))}">${esc(TT('usa el común'))}</span>`;
  const te = r.vista === 'lck' ? (r.com ? `<span class="tag com">${esc(TT('común'))}</span>` : r.te.map(c => esc(N[c] || c)).join(' · ')) : r.vista === 'menu' ? `<span title="${esc(r.ctxs.join('\n'))}">${esc(r.ctx)}${r.ns.length > 1 ? ` <b class="dim">+${r.ns.length - 1}</b>` : ''}</span>` : '';
  const largo = r.vista === 'guia' && (r.val.length > 70 || (r.en || '').length > 70);
  const ed = largo ? `<textarea rows="${Math.min(6, Math.ceil(Math.max(r.val.length, (r.en || '').length) / 70))}" spellcheck="false" data-noi18n>${esc(r.val)}</textarea>`
                   : `<input type="text" value="${esc(r.val)}" spellcheck="false" data-noi18n>`;
  return `<tr data-i="${i}" class="${s.mod ? 'mod' : ''} ${s.bad ? 'badv' : ''}">
    <td class="id" title="${esc(r.id)}" data-noi18n>${esc(r.id)}${r.ns && r.ns.length > 1 ? ' ×' + r.ns.length : ''}</td><td class="te" data-noi18n>${te}</td>
    <td class="en${largo ? '' : ' una'}" data-noi18n title="${esc(r.en ?? '')}">${r.en == null ? '<span class="dim">—</span>' : esc(r.en)}</td>
    <td class="es">${ed}</td><td class="st">${st}</td></tr>`;
}
function pintar(){
  const n = Math.max(1, Math.ceil(VIEW.length / PER)); if (PAGE >= n) PAGE = n - 1;
  const ini = PAGE * PER;
  $('tb').innerHTML = VIEW.length ? VIEW.slice(ini, ini + PER).map((r, k) => fila(r, ini + k)).join('') : `<tr><td colspan="5" class="vacio">${esc(TT('Sin resultados'))}</td></tr>`;
  $('pInfo').textContent = VIEW.length ? `${ini + 1}–${Math.min(ini + PER, VIEW.length)} / ${VIEW.length}` : '';
  $('pPrev').disabled = PAGE === 0; $('pNext').disabled = PAGE >= n - 1;
  $('sum').textContent = ROWS.filter(r => r.vista === VISTA).length + ' ' + TT('textos');
}
function refrescar(tr){ if (!tr || !tr.isConnected) return; if (tr.dataset.fuera) return; tr.dataset.fuera = '1'; const n = document.createElement('tbody'); n.innerHTML = fila(VIEW[+tr.dataset.i], +tr.dataset.i); tr.replaceWith(n.firstElementChild); }
const pendientes = () => ROWS.some(r => r.val !== r.base || r.forzar);
function botones(){ const p = pendientes(); $('bSave').disabled = !p || ROWS.some(r => estado(r).mod && estado(r).bad); $('bDes').disabled = !p; }

$('tb').addEventListener('input', e => { const tr = e.target.closest('tr[data-i]'); if (!tr) return; const r = VIEW[+tr.dataset.i]; r.val = e.target.value; if (r.var) r.forzar = true;
  const s = estado(r); tr.classList.toggle('mod', s.mod); tr.classList.toggle('badv', s.bad); botones(); });
$('tb').addEventListener('change', e => refrescar(e.target.closest('tr[data-i]')));
$('tb').addEventListener('keydown', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  if (e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); const n = tr.nextElementSibling; if (n){ const x = n.querySelector('input,textarea'); if (x) x.focus(); } refrescar(tr); }
  if (e.key === 'Escape'){ const r = VIEW[+tr.dataset.i]; r.val = r.base; r.forzar = false; refrescar(tr); botones(); }
});
$('tb').addEventListener('click', e => { const u = e.target.closest('button[data-unif]'); if (u){ const tr = u.closest('tr'); VIEW[+tr.dataset.i].forzar = true; refrescar(tr); botones(); return; }
  const td = e.target.closest('td.en'); if (!td) return; const tr = td.closest('tr'), r = VIEW[+tr.dataset.i]; if (r.en == null) return; r.val = r.en; if (r.var) r.forzar = true; refrescar(tr); botones(); });
$('q').addEventListener('input', () => { clearTimeout(window._qt); window._qt = setTimeout(filtrar, 150); });
$('vsel').addEventListener('click', e => { const b = e.target.closest('button'); if (b) poner(b.dataset.v); });
$('filtros').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; FILTRO = b.dataset.f; document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x === b)); filtrar(); });
$('pPrev').onclick = () => { PAGE--; pintar(); };
$('pNext').onclick = () => { PAGE++; pintar(); };
$('bDes').onclick = () => { if (!confirm('¿Deshacer todos los cambios sin guardar?')) return; for (const r of ROWS){ r.val = r.base; r.forzar = false; } filtrar(); };
window.addEventListener('beforeunload', e => { if (pendientes()){ e.preventDefault(); e.returnValue = ''; } });

// ---------- guardar ----------
async function post(url, bytes){ const r = await fetch(url, { method: 'POST', body: bytes }); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'el servidor no lo guardó'); return j; }
$('bSave').onclick = async () => {
  const cam = ROWS.filter(r => r.val !== r.base || r.forzar); if (!cam.length) return;
  let fallos = 0;
  const paso = async (nombre, f) => { veil(TT('Guardando') + ' ' + nombre + '…'); await tick(); try { await f(); } catch(e){ fallos++; log('ERROR ' + nombre + ': ' + e.message); } };
  // LckTxtRc: los comunes (fila con Corea, sin cambios propios) a la base; el resto, al fichero de cambios de sus teatros
  const L = D.lck, base = new Map(), porTe = new Map();
  for (const r of cam.filter(r => r.vista === 'lck')){
    if (r.esBase) base.set(r.id, r.val);
    else for (const c of r.te){ if (!porTe.has(c)) porTe.set(c, new Map()); porTe.get(c).set(r.id, r.val); }
  }
  if (base.size) await paso('LckTxtRc.irc', async () => { const t = escribirIrc(L.baseTxt, base); const j = await post(api('lck', { que: 'base' }), enc(t));
    L.baseTxt = t; log(TT('Guardado') + ' ' + j.ruta + ': ' + base.size + ' ' + TT('texto(s)')); });
  for (const [c, m] of porTe) await paso('Cambios_' + c + '.irc', async () => {
    const prev = L.camTxt[c] || ('# ' + TT('Textos propios de') + ' ' + c + '. ' + TT('El instalador los pone encima de LckTxtRc.irc.') + '\r\n# ' + TT('Una línea [ADDTEXT] por texto. Guardar en ANSI.') + '\r\n');
    const t = escribirIrc(prev, m), b = enc(t); if (!b) throw new Error(TT('carácter no válido'));
    const j = await post(api('lck', { que: 'cambios', t: c }), b); L.camTxt[c] = t;
    const x = L.te.find(y => y.clave === c); if (x) x.cambios = true;
    log(TT('Guardado') + ' ' + j.ruta + ': ' + m.size + ' ' + TT('texto(s)') + (j.csv ? ' · Archivos.csv: + ' + j.csv : ''));
  });
  for (const k of ['guia', 'ayuda']){ const m = new Map(cam.filter(r => r.vista === k).map(r => [r.id, r.val])); if (!m.size) continue;
    await paso(D[k].rel, async () => { const t = escribirIrc(D[k].txt, m); const j = await post(api('guardar', { rel: D[k].rel }), enc(t)); D[k].txt = t; D[k].ed = leerIrc(t); log(TT('Guardado') + ' ' + D[k].rel + ': ' + m.size + ' ' + TT('texto(s)')); }); }
  const mm = new Map(cam.filter(r => r.vista === 'menu').flatMap(r => r.ns.map(n => [n, r.val])));
  if (mm.size) await paso('Menu.dat', async () => { const t = escribirMenu(D.menu.txt, mm), b = enc(t);
    for (const rel of D.menu.rels){ await post(api('guardar', { rel }), b); log(TT('Guardado') + ' ' + rel + ': ' + mm.size + ' ' + TT('línea(s)')); }
    D.menu.txt = t; D.menu.E = leerMenu(t); });
  veil('');
  if (fallos){ alert(TT('Algún fichero no se pudo guardar (mira el registro).')); return; }
  L.base = leerIrc(L.baseTxt); for (const t of L.te) L.cam[t.clave] = leerIrc(L.camTxt[t.clave] || '').m;
  construir(); pintarFicheros(); filtrar();
};

// ---------- exportar / importar (las cuatro vistas) ----------
const VNOM = { lck: 'LckTxtRc.irc', guia: 'GuideTxt.irc', ayuda: 'HelpText.irc', menu: 'Menu.dat' };
function descargar(nombre, texto){ const blob = new Blob(['﻿' + texto], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
const csvq = x => '"' + String(x ?? '').replace(/"/g, '""') + '"';
$('bExp').onclick = e => { e.stopPropagation(); $('mExp').classList.toggle('on'); };
document.addEventListener('click', () => $('mExp').classList.remove('on'));
$('mExp').addEventListener('click', e => {
  const b = e.target.closest('button[data-x]'); if (!b) return; $('mExp').classList.remove('on');
  const x = b.dataset.x, N = NOMBRES();
  if (x === 'csv'){
    const l = [['ID', TT('Fichero'), TT('Teatros'), TT('Inglés'), TT('Traducción')].map(csvq).join(';')];
    for (const r of ROWS) l.push([r.xid, VNOM[r.vista], r.vista === 'lck' ? (r.com ? TT('común') : r.te.map(c => N[c] || c).join(', ')) : r.ctxs ? r.ctxs.join(' | ') : '', r.en ?? '', r.val].map(csvq).join(';'));
    descargar('Ayuda_y_menus.csv', l.join('\r\n') + '\r\n'); log(TT('Exportados') + ' ' + ROWS.length + ' ' + TT('textos'));
  } else {
    const R = ROWS.filter(r => r.en != null && (x === 'txt' || estado(r).igual));
    descargar(x === 'txt' ? 'Ayuda_y_menus_ingles.txt' : 'Ayuda_y_menus_falta.txt', R.map(r => '[[' + r.xid + ']]\r\n' + r.en).join('\r\n\r\n') + '\r\n');
    log(TT('Exportados') + ' ' + R.length + ' ' + TT('textos'));
  }
});
function leerCsv(t){
  const sep = (t.split('\n')[0].match(/\t/) ? '\t' : ';'), F = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++){ const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true; else if (ch === sep){ r.push(c); c = ''; }
    else if (ch === '\n'){ r.push(c.replace(/\r$/, '')); F.push(r); r = []; c = ''; } else c += ch; }
  if (c || r.length){ r.push(c); F.push(r); }
  return F;
}
$('bImp').onclick = () => $('fImp').click();
$('fImp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const t = (await f.text()).replace(/^﻿/, ''), datos = new Map();
  const MK = /^[ \t]*\[\[\s*([LGHM]:[^\]\s]+)\s*\]\][ \t]*$/gm;
  const ms = [...t.matchAll(MK)];
  if (ms.length){
    ms.forEach((m, i) => { const fin = i + 1 < ms.length ? ms[i + 1].index : t.length; datos.set(m[1], t.slice(m.index + m[0].length, fin).replace(/\s+/g, ' ').trim()); });
  } else {
    const F = leerCsv(t), h = (F[0] || []).map(x => norm(x)), ci = h.indexOf('id'), ct = h.length - 1;
    if (ci >= 0) for (const r of F.slice(1)) if (r[ci] && /^[LGHM]:/.test(r[ci].trim())) datos.set(r[ci].trim(), (r[ct] || '').replace(/[\r\n]+/g, ' ').trim());
  }
  if (!datos.size){ alert(TT('El fichero no tiene textos exportados desde aquí (faltan los [[ID]] o la columna ID).')); return; }
  // las de LckTxtRc se buscan por ID y teatro (los grupos de teatros pueden haber cambiado)
  const porX = new Map(ROWS.map(r => [r.xid, r]));
  const busca = id => { if (porX.has(id)) return porX.get(id); const m = /^L:(.+):([^:]+)$/.exec(id); if (m) return ROWS.find(r => r.vista === 'lck' && r.id === m[1] && r.te.includes(m[2]));
    const n = /^M:(\d+)$/.exec(id); return n ? ROWS.find(r => r.vista === 'menu' && r.ns.includes(+n[1])) : null; };
  let n = 0, no = 0, malos = 0;
  for (const [id, v] of datos){ const r = busca(id); if (!r){ no++; continue; } if (!v || v === r.val) continue; r.val = v; if (r.var) r.forzar = true; n++; if (estado(r).bad) malos++; }
  filtrar();
  log(TT('Importado') + ' ' + f.name + ': ' + n + ' ' + TT('texto(s) cambiados') + (no ? ', ' + no + ' ' + TT('ya no existen') : '') + (malos ? ', ' + malos + ' ' + TT('con caracteres no válidos') : '') + '. ' + TT('Revisa y pulsa Guardar.'));
  if (n){ FILTRO = 'mod'; document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x.dataset.f === 'mod')); filtrar(); }
};
// la altura de la tabla, por los avisos
new ResizeObserver(() => { $('main').style.height = `calc(100% - ${document.querySelector('header').offsetHeight + $('avisos').offsetHeight}px)`; }).observe(document.body);
init();
</script>
</body>
