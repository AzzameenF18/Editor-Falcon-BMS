<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de Falcon BMS</title>
<style>
:root{--bg:#14191F;--pan:#1A2129;--line:#2E3A47;--txt:#DCE3EA;--dim:#8A98A8;--acc:#E0A13A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
nav{display:flex;align-items:stretch;gap:2px;height:38px;padding:0 10px;background:#10151A;border-bottom:1px solid var(--line)}
nav .marca{display:flex;align-items:center;gap:8px;margin-right:14px;font-weight:600;color:var(--acc);font-size:13px}
nav .marca i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;font-size:13px;padding:0 16px;cursor:pointer}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--txt);border-bottom-color:var(--acc)}
nav .sp{flex:1}
nav .nota{align-self:center;color:var(--dim);font-size:12px}
#marcos{position:absolute;top:38px;left:0;right:0;bottom:0}
#marcos iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#marcos iframe.on{display:block}
</style>
</head>
<body>
<nav>
  <span class="marca"><i></i>Falcon BMS</span>
  <button data-m="scf" title="Menús de la interfaz (.scf)">Editor SCF</button>
  <button data-m="rsc" title="Imágenes, textos y sonidos de los .rsc">Editor RSC</button>
  <button data-m="camp" title="Campañas, TE y entrenamientos (.cam/.tac/.trn/.run) de la traducción">Campañas</button>
  <button data-m="voz" title="Voces de radio en español (Falcon.tlk) con XTTS">Voces</button>
  <button data-m="vaj" title="Ajustar y probar cada una de las 14 voces">Ajuste de voces</button>
  <span class="sp"></span>
  <span class="nota" id="nota"></span>
</nav>
<div id="marcos"></div>
<script>
'use strict';
const K = new URLSearchParams(location.search).get('k') || '';
const marcos = {}, listo = {}, pendiente = {};
function marco(m){
  if (!marcos[m]){
    const f = document.createElement('iframe');
    f.src = '/' + m + '/?k=' + encodeURIComponent(K);
    f.title = m;
    document.getElementById('marcos').appendChild(f);
    marcos[m] = f;
  }
  return marcos[m];
}
function mostrar(m){
  marco(m);
  for (const [k, f] of Object.entries(marcos)) f.classList.toggle('on', k === m);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  try { localStorage.setItem('bms-pestana', m); } catch(e){}
}
function enviar(m, msg){
  const f = marco(m);
  if (listo[m]) f.contentWindow.postMessage(msg, location.origin);
  else pendiente[m] = msg;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => mostrar(b.dataset.m));

// Mensajes entre pestañas
window.addEventListener('message', ev => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.tipo === 'listo' && d.modulo){
    listo[d.modulo] = true;
    if (pendiente[d.modulo]){ marcos[d.modulo].contentWindow.postMessage(pendiente[d.modulo], location.origin); delete pendiente[d.modulo]; }
  }
  if (d.tipo === 'abrirRsc'){
    // desde el SCF: abrir un .rsc (teatro '' = Corea, 'Add-On X') y seleccionar el recurso
    mostrar('rsc');
    enviar('rsc', { tipo: 'abrirRsc', teatro: d.teatro || '', rsc: d.rsc, id: d.id || null });
    document.getElementById('nota').textContent = 'Abriendo ' + d.rsc + (d.id ? ' · ' + d.id : '') + '…';
    setTimeout(() => { document.getElementById('nota').textContent = ''; }, 4000);
  }
  if (d.tipo === 'rscGuardado' && marcos.scf){
    // el SCF recarga las imágenes de ese .rsc (si lo tiene abierto)
    enviar('scf', { tipo: 'rscGuardado', teatro: d.teatro || '', rsc: d.rsc });
  }
  if (d.tipo === 'abrirScf'){
    // el editor RSC usa '' para Corea y 'Add-On X' para los Add-On; el SCF, 'Art' y 'Add-On X\Art'
    const t = d.teatro ? d.teatro + '\\Art' : 'Art';
    mostrar('scf');
    enviar('scf', { tipo: 'abrirScf', t, p: d.p });
    document.getElementById('nota').textContent = 'Abriendo ' + d.p + '…';
    setTimeout(() => { document.getElementById('nota').textContent = ''; }, 4000);
  }
});

let ini = 'scf'; try { ini = localStorage.getItem('bms-pestana') || 'scf'; } catch(e){}
if (!['scf','rsc','camp','voz','vaj'].includes(ini)) ini = 'scf';
mostrar(ini);
</script>
</body>
</html>
