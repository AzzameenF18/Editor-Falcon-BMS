<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de campañas · Falcon BMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14191F; --panel:#1C232B; --panel2:#222B35; --line:#2C3640;
  --text:#E6EBF0; --dim:#8A96A3; --acc:#F2A900; --ok:#4CC38A; --bad:#F06A6A; --sel:#38B6FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:54px}
header h1{font-size:15px;font-weight:600;margin:0 10px 0 0;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.grow{flex:1}
button{background:#26303A;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4A5663}
button.pri{background:var(--acc);border-color:var(--acc);color:#14191F;font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=search]{background:#11161B;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit}
#q{width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12px;background:#1A2129;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#14191F;font-weight:600}
.seg button b{font-weight:400;opacity:.75;margin-left:4px}
main{display:grid;grid-template-columns:1fr 300px;height:calc(100% - 55px)}
#left{display:flex;flex-direction:column;min-width:0;min-height:0}
#tblWrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);z-index:2}
tbody td{padding:3px 10px;border-bottom:1px solid #1E262E;vertical-align:middle}
tbody tr:hover td{background:#181F27}
td.en{color:#B9C4CF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:copy}
td.es input{width:100%;font-family:inherit;white-space:pre;background:transparent;border:1px solid transparent;color:var(--text);padding:5px 7px;border-radius:4px;font:inherit}
td.es input:hover{border-color:var(--line)}
td.es input:focus{outline:none;border-color:var(--sel);background:#11161B}
tr.mod td.es input{color:var(--acc)}
tr.badv td.es input{border-color:var(--bad);color:var(--bad)}
td.n{color:var(--dim);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
td.st{font-size:11px;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;margin-right:4px;border:1px solid var(--line);color:var(--dim)}
.tag.same{color:#9ccff0;border-color:#2b4a5e}
.tag.var{color:var(--acc);border-color:#5a4512;cursor:help}
.tag.bad{color:var(--bad);border-color:#5e2b2b}
.tag.k{color:#B9C4CF}
.tag.mod{color:#14191F;background:var(--acc);border-color:var(--acc)}
td.act button{padding:2px 6px;font-size:11px;opacity:.0}
tr:hover td.act button{opacity:1}
#pager{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.fl{font-size:12px;margin-bottom:16px}
.fl div{padding:6px 0;border-bottom:1px solid #26303A}
.fl div>span:first-child{display:block;font-weight:600}
.fl div>span:last-child{color:var(--dim)}
.fl .w{color:var(--acc)}
.fl .e{color:var(--bad)}
.ok{color:var(--ok)}
.dim{color:var(--dim)}
.box{background:#11161B;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:#B9C4CF;margin-bottom:14px;line-height:1.5}
.box b{color:var(--text)}
#log{font-size:12px;white-space:pre-wrap;color:#B9C4CF}
#veil{position:fixed;inset:0;background:rgba(5,8,11,.72);display:none;align-items:center;justify-content:center;z-index:100;font-size:14px}
#veil div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 26px;min-width:320px}
.bytes{font-size:11px;color:var(--dim);margin-left:4px}
.bytes.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1><i></i>Editor de campañas</h1>
  <select id="teatro" title="Teatro"></select>
  <div class="seg" id="tabs">
    <button data-t="obj" class="on" title="Nombres de objetivos (.cam/.tac)">Objetivos<b id="nObj"></b></button>
    <button data-t="bando" title="Nombres y descripciones de los bandos (.cam/.tac/.trn); en TE y entrenamientos, la descripción es el texto de la misión">Bandos<b id="nBando"></b></button>
    <button data-t="run" title="Textos en pantalla de los entrenamientos (.run)">Entrenamiento<b id="nRun"></b></button>
  </div>
  <div class="sep"></div>
  <input id="q" type="search" placeholder="Buscar en inglés o español…">
  <div class="seg" id="filtros">
    <button data-f="todos" class="on">Todos<b id="cTodos"></b></button>
    <button data-f="igual" title="El español es igual que el inglés">Sin traducir<b id="cIgual"></b></button>
    <button data-f="var" title="El mismo nombre inglés tiene traducciones distintas en distintos ficheros">Variantes<b id="cVar"></b></button>
    <button data-f="mod" title="Cambiados y sin guardar">Cambiados<b id="cMod"></b></button>
  </div>
  <div class="grow"></div>
  <button id="bExp" class="sm" title="Exporta Inglés→Español a un .txt (separado por tabulador)">Exportar</button>
  <button id="bImp" class="sm" title="Importa un .txt Inglés[TAB]Español">Importar</button>
  <input type="file" id="fImp" accept=".txt,.tsv,.csv" hidden>
  <button id="bDes" disabled>Deshacer todo</button>
  <button id="bSave" class="pri" disabled>Guardar</button>
</header>
<main>
  <div id="left">
    <div id="tblWrap">
      <table>
        <colgroup><col style="width:38%"><col><col style="width:64px"><col style="width:150px"><col style="width:40px"></colgroup>
        <thead><tr><th>Inglés (original)</th><th>Español</th><th style="text-align:right">Veces</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="pager"><button class="sm" id="pPrev">◀</button><span id="pInfo"></span><button class="sm" id="pNext">▶</button><span class="grow"></span><span id="sum"></span></div>
  </div>
  <aside>
    <h3>Ficheros del teatro</h3>
    <div class="fl" id="fl"></div>
    <div class="box" id="ayuda"></div>
    <h3>Registro</h3>
    <div id="log"></div>
  </aside>
</main>
<div id="veil"><div id="veilTxt"></div></div>
<script>
// ===== Núcleo: contenedor .cam/.tac, bloque .obj (LZSS) y nombres de objetivos =====
const CampCore = (() => {
  const u32 = (b, o) => (b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24)) >>> 0;
  const u16 = (b, o) => b[o] | (b[o+1] << 8);
  const w32 = (b, o, v) => { b[o] = v & 255; b[o+1] = (v >>> 8) & 255; b[o+2] = (v >>> 16) & 255; b[o+3] = (v >>> 24) & 255; };

  // Directorio: u32 al inicio = posición del directorio; allí u32 n y n × (len, nombre, u32 pos, u32 tam)
  function readDir(b){
    const off = u32(b, 0), n = u32(b, off); let p = off + 4; const ents = [];
    for (let i = 0; i < n; i++){
      const l = b[p]; let name = ''; for (let k = 0; k < l; k++) name += String.fromCharCode(b[p+1+k]);
      ents.push({ name, off: u32(b, p+1+l), size: u32(b, p+5+l) }); p += 9 + l;
    }
    return { off, ents, tail: b.slice(p) };
  }
  function build(ents, data, tail){
    let total = 4; for (const e of ents) total += data[e.name].length;
    let dirLen = 4; for (const e of ents) dirLen += 9 + e.name.length;
    const out = new Uint8Array(total + dirLen + tail.length);
    let p = 4; const pos = {};
    for (const e of ents){ pos[e.name] = p; out.set(data[e.name], p); p += data[e.name].length; }
    w32(out, 0, p);
    w32(out, p, ents.length); p += 4;
    for (const e of ents){
      out[p] = e.name.length; for (let k = 0; k < e.name.length; k++) out[p+1+k] = e.name.charCodeAt(k);
      w32(out, p+1+e.name.length, pos[e.name]); w32(out, p+5+e.name.length, data[e.name].length); p += 9 + e.name.length;
    }
    out.set(tail, p);
    return out;
  }

  // LZSS: bandera LSB primero (1 = literal); referencia a,b: pos = ((a&15)<<8)|b, len = (a>>4)+2; ventana 4096 a ceros, empieza en 1
  function lzDec(src, ulen){
    const N = 4096, win = new Uint8Array(N), out = new Uint8Array(ulen);
    let r = 1, o = 0, i = 0, flags = 0;
    while (i < src.length && o < ulen){
      flags >>= 1;
      if (!(flags & 0x100)){ flags = src[i++] | 0xff00; if (i >= src.length) break; }
      if (flags & 1){ const c = src[i++]; out[o++] = c; win[r % N] = c; r++; }
      else {
        const a = src[i], b2 = src[i+1]; i += 2;
        const pos = ((a & 15) << 8) | b2, ln = (a >> 4) + 2;
        for (let k = 0; k < ln && o < ulen; k++){ const c = win[(pos + k) % N]; out[o++] = c; win[r % N] = c; r++; }
      }
    }
    return out;
  }
  function lzEnc(data){
    const N = 4096, MAXLEN = 17, MINLEN = 3, CHAIN = 48, MAXDIST = N - MAXLEN - 1;
    const n = data.length, out = new Uint8Array(n + Math.ceil(n / 8) + 16);
    const head = new Int32Array(1 << 16).fill(-1), prev = new Int32Array(n).fill(-1);
    const hash = k => ((data[k] << 8) ^ (data[k+1] << 4) ^ data[k+2]) & 0xffff;
    const ins = k => { if (k + 3 <= n){ const h = hash(k); prev[k] = head[h]; head[h] = k; } };
    let o = 0, flagpos = -1, bit = 8, flags = 0, i = 0;
    const startGroup = () => { if (flagpos >= 0) out[flagpos] = flags; flagpos = o++; bit = 0; flags = 0; };
    while (i < n){
      let best = 0, bj = -1;
      if (i + MINLEN <= n){
        let j = head[hash(i)], c = 0;
        while (j >= 0 && c < CHAIN && i - j <= MAXDIST){
          if (data[j] === data[i] && data[j+1] === data[i+1] && data[j+2] === data[i+2]){
            let l = 0; while (l < MAXLEN && i + l < n && data[j+l] === data[i+l]) l++;
            if (l > best){ best = l; bj = j; if (best === MAXLEN) break; }
          }
          j = prev[j]; c++;
        }
      }
      if (bit === 8) startGroup();
      if (best >= MINLEN){
        const pos = (bj + 1) % N;
        out[o++] = ((best - 2) << 4) | (pos >> 8); out[o++] = pos & 255;
        for (let k = i; k < i + best; k++) ins(k);
        i += best;
      } else {
        flags |= 1 << bit; out[o++] = data[i]; ins(i); i++;
      }
      bit++;
    }
    if (flagpos >= 0) out[flagpos] = flags;
    return out.slice(0, o);
  }

  function load(bytes){
    const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    const d = readDir(b);
    const obj = d.ents.find(e => /\.obj$/i.test(e.name));
    const data = {}; for (const e of d.ents) data[e.name] = b.slice(e.off, e.off + e.size);
    const res = { bytes: b, ents: d.ents, tail: d.tail, data, obj: null };
    if (obj){
      const raw = data[obj.name];
      const cnt = u16(raw, 0), ulen = u32(raw, 2), clen = u32(raw, 6);
      if (ulen > 0) res.obj = { name: obj.name, cnt, ulen, clen, out: lzDec(raw.subarray(10, 10 + clen), ulen) };
    }
    // .cmp: u32 tamaño, u32 tamaño descomprimido, datos LZSS. El primer u32 es el tamaño
    // comprimido (campañas) o ese tamaño + 4 (TE y entrenamientos): se conserva la diferencia.
    const cmp = d.ents.find(e => /\.cmp$/i.test(e.name));
    if (cmp){
      const raw = data[cmp.name], clen = u32(raw, 0), ulen = u32(raw, 4), dif = raw.length - clen;
      if ((dif === 8 || dif === 4) && ulen >= TEAM0 + TEAMSZ * 8 && ulen < 1 << 24) res.cmp = { name: cmp.name, ulen, dif, out: lzDec(raw.subarray(8), ulen) };
    }
    // .te: texto plano con los nombres de bando del enfrentamiento táctico
    const te = d.ents.find(e => /\.te$/i.test(e.name));
    if (te) res.te = { name: te.name, text: dec(data[te.name], 0, data[te.name].length) };
    return res;
  }

  // Campos de nombre: 80 bytes, texto terminado en 0 y relleno con ceros.
  // Firma tras el campo: id (2 bytes) · tipo (2) · 6 ceros · mismo id (2)
  function findNames(out){
    const res = new Map(), n = out.length;
    const okField = t => {
      if (t < 16 || t + 80 > n) return null;
      let z = -1; for (let k = 0; k < 80; k++) if (out[t+k] === 0){ z = k; break; }
      if (z < 2) return null;
      for (let k = z; k < 80; k++) if (out[t+k] !== 0) return null;
      for (let k = 0; k < z; k++) if (out[t+k] < 0x20) return null;
      return z;
    };
    for (let e = 80; e + 12 <= n; e++){
      if (out[e] !== out[e+10] || out[e+1] !== out[e+11]) continue;
      if (out[e+4] | out[e+5] | out[e+6] | out[e+7] | out[e+8] | out[e+9]) continue;
      if (out[e-1] !== 0 || (out[e] === 0 && out[e+1] === 0)) continue;
      const t = e - 80, z = okField(t); if (z != null) res.set(t, z);
    }
    for (const t of [...res.keys()]) if (res.has(t + 1)) res.delete(t);
    // último registro (sin firma detrás): 8 ceros 4 bytes antes del campo
    for (let p = 0; p + 2 < n; ){
      let q = p; while (q < n && out[q] >= 0x20 && !(out[q] > 0x7e && out[q] < 0xa0)) q++;
      if (q - p >= 2 && q < n && out[q] === 0){
        for (let c = p; c < Math.min(p + 5, q); c++){
          let zeros = c >= 12; for (let k = c - 12; zeros && k < c - 4; k++) if (out[k] !== 0) zeros = false;
          if (zeros){ const z = okField(c); if (z != null && !res.has(c)) res.set(c, z); break; }
        }
      }
      p = q + 1;
    }
    return [...res.entries()].sort((a,b) => a[0] - b[0]).map(([t, z]) => ({ off: t, len: z }));
  }

  // Bandos dentro del .cmp: 8 registros de 222 bytes desde el byte 130;
  // nombre (20 bytes, máx. 19 caracteres) y descripción (200 bytes, máx. 199)
  const TEAM0 = 130, TEAMSZ = 222, NAMELEN = 20, DESCLEN = 200;
  function teams(f){
    if (!f.cmp) return [];
    const o = f.cmp.out, r = [];
    const s = (a, n) => { let z = a; while (z < a + n && o[z]) z++; return dec(o, a, z - a); };
    for (let k = 0; k < 8; k++){
      const b = TEAM0 + TEAMSZ * k;
      r.push({ k, nameOff: b, name: s(b, NAMELEN), descOff: b + NAMELEN, desc: s(b + NAMELEN, DESCLEN) });
    }
    return r;
  }
  // nombres de bando del .te (líneas que siguen a :TeamName)
  function teNames(f){
    if (!f.te) return [];
    const r = []; const re = /:TeamName\r?\n([^\r\n]*)/g; let m;
    while ((m = re.exec(f.te.text))) r.push({ idx: m.index + m[0].length - m[1].length, name: m[1] });
    return r;
  }

  // Windows-1252
  const HI = '€\u0081‚ƒ„…†‡ˆ‰Š‹Œ\u008DŽ\u008F\u0090‘’“”•–—˜™š›œ\u009DžŸ';
  function dec(out, off, len){ let s = ''; for (let k = 0; k < len; k++){ const c = out[off+k]; s += c >= 0x80 && c < 0xa0 ? HI[c - 0x80] : String.fromCharCode(c); } return s; }
  function enc(str){
    const a = [];
    for (const ch of str){
      const c = ch.charCodeAt(0);
      if (c < 0x80 || (c >= 0xa0 && c < 0x100)) a.push(c);
      else { const i = HI.indexOf(ch); if (i >= 0) a.push(0x80 + i); else return null; }
    }
    return new Uint8Array(a);
  }

  function comprimeVerifica(out){
    const comp = lzEnc(out), chk = lzDec(comp, out.length);
    for (let k = 0; k < out.length; k++) if (chk[k] !== out[k]) throw new Error('Fallo al comprimir (verificación)');
    return comp;
  }
  function ponTexto(out, off, size, text, minLen){
    const b = enc(text);
    if (!b || b.length > size - 1 || b.length < minLen || /[\x00-\x1f]/.test(text)) throw new Error('Texto no válido: ' + text);
    out.fill(0, off, off + size); out.set(b, off);
  }
  // Guarda cambios y reconstruye el fichero.
  //   changes:  [{off, text}] nombres de objetivos (.obj)
  //   extra.cmp: [{off, size, text}] campos de bando (.cmp)
  //   extra.te:  [{idx, old, text}] nombres de bando del .te
  function save(f, changes, extra){
    extra = extra || {};
    const data = Object.assign({}, f.data), tocados = new Set();
    let outObj = null, outCmp = null;
    if (changes && changes.length){
      outObj = f.obj.out.slice();
      for (const c of changes) ponTexto(outObj, c.off, 80, c.text, 1);
      const comp = comprimeVerifica(outObj);
      const raw = new Uint8Array(10 + comp.length);
      raw[0] = f.obj.cnt & 255; raw[1] = f.obj.cnt >> 8; w32(raw, 2, outObj.length); w32(raw, 6, comp.length); raw.set(comp, 10);
      data[f.obj.name] = raw; tocados.add(f.obj.name);
    }
    if (extra.cmp && extra.cmp.length){
      outCmp = f.cmp.out.slice();
      for (const c of extra.cmp) ponTexto(outCmp, c.off, c.size, c.text, 0);
      const comp = comprimeVerifica(outCmp);
      const raw = new Uint8Array(8 + comp.length);
      w32(raw, 0, raw.length - f.cmp.dif); w32(raw, 4, outCmp.length); raw.set(comp, 8);
      data[f.cmp.name] = raw; tocados.add(f.cmp.name);
    }
    if (extra.te && extra.te.length){
      let t = f.te.text;
      for (const c of [...extra.te].sort((a, b) => b.idx - a.idx)){
        if (t.substr(c.idx, c.old.length) !== c.old) throw new Error('El .te no coincide');
        if (!enc(c.text) || /[\r\n]/.test(c.text) || !c.text) throw new Error('Nombre no válido: ' + c.text);
        t = t.slice(0, c.idx) + c.text + t.slice(c.idx + c.old.length);
      }
      data[f.te.name] = enc(t); tocados.add(f.te.name);
    }
    const bytes = build(f.ents, data, f.tail);
    // comprobación final: se vuelve a leer y se comparan todos los bloques
    const back = load(bytes);
    for (const e of f.ents){
      if (tocados.has(e.name)) continue;
      const a = back.data[e.name], b = f.data[e.name];
      if (a.length !== b.length || a.some((v,i) => v !== b[i])) throw new Error('Bloque alterado: ' + e.name);
    }
    if (outObj) for (let k = 0; k < outObj.length; k++) if (back.obj.out[k] !== outObj[k]) throw new Error('Verificación del .obj fallida');
    if (outCmp) for (let k = 0; k < outCmp.length; k++) if (back.cmp.out[k] !== outCmp[k]) throw new Error('Verificación del .cmp fallida');
    return { bytes, out: outObj || (f.obj && f.obj.out) };
  }

  return { load, findNames, teams, teNames, dec, enc, save, lzDec, lzEnc, readDir, build, NAMELEN, DESCLEN };
})();
if (typeof module !== 'undefined') module.exports = CampCore;

</script>
<script>
const K = new URLSearchParams(location.search).get('k') || '';
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p.replace(/^\//, '') + (p.includes('?') ? '&' : '?') + 'k=' + K, o);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const log = t => { const d = $('#log'); d.textContent = new Date().toLocaleTimeString() + '  ' + t + '\n' + d.textContent; };
const veil = t => { $('#veil').style.display = t ? 'flex' : 'none'; $('#veilTxt').textContent = t || ''; };
const tick = () => new Promise(r => setTimeout(r, 0));

// Tipos de texto: pestaña, límite de caracteres y si puede quedar vacío
const TIPOS = {
  obj:    { tab: 'obj',   max: 79,  vacio: false, nombre: 'Objetivo' },
  nombre: { tab: 'bando', max: 19,  vacio: false, nombre: 'Nombre de bando' },
  desc:   { tab: 'bando', max: 199, vacio: true,  nombre: 'Descripción' },
  run:    { tab: 'run',   max: 250, vacio: false, nombre: 'Texto en pantalla' },
};
const AYUDA = {
  obj: 'Cada fila es un <b>nombre de objetivo</b>. Al cambiarlo se cambia en <b>todos los ficheros</b> del teatro donde aparece ese nombre inglés. Máximo <b>79 caracteres</b>.',
  bando: 'Nombres de los bandos (máx. <b>19</b>) y su <b>descripción</b> (máx. <b>199</b>). En los TE y entrenamientos, la descripción es el texto que sale al elegir la misión.<br>Las descripciones de entrenamiento van <b>rellenas con espacios</b> para partir las líneas del recuadro (unas 31 columnas por línea): respeta ese relleno.',
  run: 'Textos que aparecen en pantalla al empezar los <b>entrenamientos</b> (líneas <code>Print</code> de los .run). Sin comillas dobles. Comprueba en el juego que la fuente muestra bien las tildes.',
};
const COMUN = '<br><b>Intro</b> pasa a la fila siguiente · <b>Esc</b> deshace la fila · clic en el inglés lo copia al español. Solo caracteres ANSI (Windows-1252).';

let INFO = null, TEATRO = null, FILES = [], GROUPS = [], VIEW = [], PAGE = 0, FILTRO = 'todos', TAB = 'obj';
const PER = 200;

async function init(){
  try {
    const r = await api('/api/info'); if (!r.ok) throw 0;
    INFO = await r.json();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:40px;max-width:640px;line-height:1.6"><h2>No se encuentra el instalador de la traducción</h2><p class="dim">El editor de campañas trabaja sobre los ficheros de la carpeta <b>Ficheros</b> del instalador. Pon la carpeta del editor junto a la carpeta <b>Instalador</b> (o dentro de ella) y vuelve a abrir <b>Editor_BMS.bat</b>.</p></div>';
    return;
  }
  const sel = $('#teatro'); const teatros = [...new Set(INFO.filas.map(f => f.teatro))];
  if (!teatros.length){ log('No hay ficheros .cam/.tac/.trn/.run de Campaign en ' + (INFO.csv || 'Archivos.csv')); return; }
  sel.innerHTML = teatros.map(t => `<option>${esc(t)}</option>`).join('');
  sel.onchange = () => cargarTeatro(sel.value);
  log('Instalador: ' + (INFO.csv || '—'));
  ayuda();
  cargarTeatro(teatros[0]);
  setInterval(() => api('/api/ping').catch(() => {}), 60000);
}
function ayuda(){ $('#ayuda').innerHTML = AYUDA[TAB] + COMUN; }

async function bajar(i, src){
  const r = await api(`/api/get?i=${i}&src=${src}`);
  if (!r.ok) return null;
  return new Uint8Array(await r.arrayBuffer());
}
const iguales = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

// ---------- textos de cada fichero ----------
// Cada fichero tiene it.items = [{tipo, es, ref}] (ref = dónde está) y, si hay original, it.en[j]
function itemsBinario(f){
  const items = [];
  if (f.obj) for (const n of CampCore.findNames(f.obj.out)) items.push({ tipo: 'obj', es: CampCore.dec(f.obj.out, n.off, n.len), ref: { off: n.off } });
  for (const b of CampCore.teams(f)){
    if (b.name) items.push({ tipo: 'nombre', es: b.name, ref: { cmp: b.nameOff, size: CampCore.NAMELEN, k: b.k, campo: 'n' } });
    if (b.desc.trim() && !/^Converted with MC/.test(b.desc)) items.push({ tipo: 'desc', es: b.desc, ref: { cmp: b.descOff, size: CampCore.DESCLEN, k: b.k, campo: 'd' } });
  }
  CampCore.teNames(f).forEach((m, q) => items.push({ tipo: 'nombre', es: m.name, ref: { te: m.idx, q } }));
  return items;
}
const RUN_RE = /((?:Wait)?Print\s+-?\d+\s+")([^"\r\n]*)(")/g;
function itemsRun(texto){
  const items = []; let m; RUN_RE.lastIndex = 0;
  while ((m = RUN_RE.exec(texto))) items.push({ tipo: 'run', es: m[2], ref: { q: items.length } });
  return items;
}
// clave para emparejar un texto con el del original
const clave = it => it.tipo === 'obj' ? 'o' + it.ref.off : it.ref.cmp != null ? 'c' + it.ref.k + it.ref.campo : it.ref.te != null ? 't' + it.ref.q : 'r' + it.ref.q;

async function cargarTeatro(t){
  if (pendientes() && !confirm('Hay cambios sin guardar. ¿Descartarlos y cambiar de teatro?')){ $('#teatro').value = TEATRO; return; }
  TEATRO = t; FILES = []; GROUPS = [];
  const filas = INFO.filas.filter(f => f.teatro === t);
  for (const [k, fila] of filas.entries()){
    veil(`Leyendo ${fila.fich}  (${k+1}/${filas.length})…`); await tick();
    const it = { fila, nombre: fila.fich.split('\\').pop(), err: null, refSrc: '', run: /\.run$/i.test(fila.fich) };
    FILES.push(it);
    try {
      const b = await bajar(fila.i, 'fich');
      if (!b){ it.err = 'no está en Ficheros'; continue; }
      it.bytes = b;
      if (it.run){ it.texto = CampCore.dec(b, 0, b.length); it.items = itemsRun(it.texto); }
      else { it.f = CampCore.load(b); it.items = itemsBinario(it.f); }
      if (!it.items.length){ it.err = 'sin textos'; continue; }
      // original en inglés: Data_ORIGINAL; si no, el del juego (si no es ya la traducción)
      for (const src of ['orig', 'game']){
        const rb = await bajar(fila.i, src); if (!rb) continue;
        if (iguales(rb, b)){ if (src === 'game') it.refNota = 'el del juego es igual que el traducido'; continue; }
        let ri;
        try { ri = it.run ? itemsRun(CampCore.dec(rb, 0, rb.length)) : (() => { const rf = CampCore.load(rb); if (it.f.obj && (!rf.obj || rf.obj.ulen !== it.f.obj.ulen)) return null; return itemsBinario(rf); })(); }
        catch (e) { continue; }
        if (!ri) continue;
        const mapa = new Map(ri.map(x => [clave(x), x.es]));
        const en = it.items.map(x => mapa.has(clave(x)) ? mapa.get(clave(x)) : null);
        const okN = en.filter(x => x != null).length;
        if (okN < it.items.length * 0.9) continue;
        if (src === 'game' && it.f && it.f.obj){
          const objs = it.items.map((x, j) => x.tipo === 'obj' && en[j] !== x.es).filter(Boolean).length;
          if (objs < it.items.filter(x => x.tipo === 'obj').length * 0.10){ it.refNota = 'el del juego ya está traducido'; continue; }
        }
        it.en = en; it.refSrc = src === 'orig' ? 'Data_ORIGINAL' : 'juego'; break;
      }
    } catch (e) { it.err = 'error: ' + e.message; }
  }
  veil('');
  agrupar(); pintarFicheros(); filtrar();
}

function agrupar(){
  const m = new Map();
  FILES.forEach((it, fi) => {
    if (!it.items) return;
    it.items.forEach((x, j) => {
      const tc = x.tipo === 'nombre' ? 'nombre' : x.tipo;
      const en = it.en ? it.en[j] : null;
      const key = tc + (en != null ? '\u0001E' + en : '\u0001S' + x.es);
      let g = m.get(key);
      if (!g){ g = { tipo: tc, en, occ: [], esCnt: new Map(), files: new Set() }; m.set(key, g); }
      g.occ.push([fi, j]); g.files.add(fi);
      g.esCnt.set(x.es, (g.esCnt.get(x.es) || 0) + 1);
    });
  });
  GROUPS = [...m.values()];
  for (const g of GROUPS){
    g.base = [...g.esCnt.entries()].sort((a, b) => b[1] - a[1])[0][0];
    g.val = g.base; g.var = g.esCnt.size > 1; g.forzar = false;
    g.k = norm((g.en || '') + '\u0001' + [...g.esCnt.keys()].join('\u0001'));
  }
  const orden = { obj: 0, nombre: 1, desc: 2, run: 3 };
  GROUPS.sort((a, b) => orden[a.tipo] - orden[b.tipo] || (a.en ?? a.base).localeCompare(b.en ?? b.base, 'en'));
  const n = t => GROUPS.filter(g => TIPOS[g.tipo].tab === t).length;
  $('#nObj').textContent = n('obj') || ''; $('#nBando').textContent = n('bando') || ''; $('#nRun').textContent = n('run') || '';
}

function estado(g){
  const T = TIPOS[g.tipo], b = CampCore.enc(g.val);
  const bad = !b || b.length > T.max || (!T.vacio && !g.val.length) || /[\x00-\x1f]/.test(g.val) || (g.tipo === 'run' && g.val.includes('"'));
  return { mod: g.val !== g.base || (g.var && g.forzar), bad, bytes: b ? b.length : -1, max: T.max };
}
const pendientes = () => GROUPS.some(g => g.val !== g.base || g.forzar);

function pintarFicheros(){
  const cuenta = it => {
    const c = { obj: 0, nombre: 0, desc: 0, run: 0 }; for (const x of it.items) c[x.tipo]++;
    return [c.obj && c.obj + ' objetivos', (c.nombre || c.desc) && (c.nombre + c.desc) + ' de bandos', c.run && c.run + ' textos'].filter(Boolean).join(' · ');
  };
  $('#fl').innerHTML = FILES.map(it => {
    let r;
    if (it.err) r = `<span class="e">${esc(it.err)}</span>`;
    else r = `<span>${cuenta(it)} · ${it.refSrc ? 'inglés: ' + it.refSrc : '<span class="w">sin inglés</span>'}</span>`;
    return `<div title="${esc(it.fila.fich + (it.refNota ? '\n' + it.refNota : ''))}"><span>${esc(it.nombre)}</span>${r}</div>`;
  }).join('');
  if (FILES.some(it => it.items && !it.en))
    log('Algún fichero no tiene original en inglés (Data_ORIGINAL o juego sin traducir): sus textos se agrupan por el español.');
}

function filtrar(){
  const q = norm($('#q').value.trim());
  const c = { todos: 0, igual: 0, var: 0, mod: 0 };
  VIEW = [];
  for (const g of GROUPS){
    if (TIPOS[g.tipo].tab !== TAB) continue;
    const s = estado(g), igual = g.en != null && g.val === g.en && /[a-z]/i.test(g.en);
    c.todos++; if (igual) c.igual++; if (g.var) c.var++; if (s.mod) c.mod++;
    if (FILTRO === 'igual' && !igual) continue;
    if (FILTRO === 'var' && !g.var) continue;
    if (FILTRO === 'mod' && !s.mod) continue;
    if (q && !g.k.includes(q) && !norm(g.val).includes(q)) continue;
    VIEW.push(g);
  }
  $('#cTodos').textContent = c.todos; $('#cIgual').textContent = c.igual; $('#cVar').textContent = c.var;
  PAGE = 0; pintar(); botones();
}

function fila(g, idx){
  const s = estado(g), igual = g.en != null && g.val === g.en;
  let st = '';
  if (g.tipo === 'nombre' || g.tipo === 'desc') st += `<span class="tag k">${g.tipo === 'nombre' ? 'nombre' : 'descripción'}</span>`;
  if (s.mod) st += '<span class="tag mod">cambiado</span>';
  if (s.bad) st += `<span class="tag bad">${s.bytes < 0 ? 'carácter no válido' : (g.tipo === 'run' && g.val.includes('"')) ? 'sin comillas' : s.bytes === 0 ? 'vacío' : s.bytes + '/' + s.max}</span>`;
  else if (s.bytes > s.max - 9) st += `<span class="tag">${s.bytes}/${s.max}</span>`;
  if (g.var && !g.forzar && g.val === g.base) st += `<span class="tag var" title="${esc([...g.esCnt.entries()].map(([t, n]) => n + '×  ' + t).join('\n'))}">${g.esCnt.size} variantes</span>`;
  if (igual && !s.mod && g.en.trim()) st += '<span class="tag same">= inglés</span>';
  const en = g.en == null ? '<span class="dim">—</span>' : esc(g.en).replace(/ {2,}/g, m => '<span class="dim">' + '·'.repeat(m.length) + '</span>');
  return `<tr data-i="${idx}" class="${s.mod ? 'mod' : ''} ${s.bad ? 'badv' : ''}">
    <td class="en" title="${g.en == null ? '' : esc(g.en) + '\n(clic: copiar al español)'}">${en}</td>
    <td class="es"><input type="text" value="${esc(g.val)}" spellcheck="false"></td>
    <td class="n" title="${g.files.size} fichero(s):\n${esc([...g.files].map(fi => FILES[fi].nombre).join('\n'))}">${g.occ.length}</td>
    <td class="st">${st}</td>
    <td class="act"><button title="Volver al valor cargado">↺</button></td></tr>`;
}

function pintar(){
  const n = Math.max(1, Math.ceil(VIEW.length / PER));
  if (PAGE >= n) PAGE = n - 1;
  const ini = PAGE * PER;
  $('#tb').innerHTML = VIEW.slice(ini, ini + PER).map((g, k) => fila(g, ini + k)).join('');
  $('#pInfo').textContent = VIEW.length ? `${ini + 1}–${Math.min(ini + PER, VIEW.length)} de ${VIEW.length}` : 'Nada que mostrar';
  $('#pPrev').disabled = PAGE === 0; $('#pNext').disabled = PAGE >= n - 1;
  $('#tblWrap').scrollTop = 0;
}

function refrescarFila(tr){
  const i = +tr.dataset.i, g = VIEW[i];
  const tmp = document.createElement('tbody'); tmp.innerHTML = fila(g, i);
  const nuevo = tmp.firstElementChild;
  tr.className = nuevo.className;
  tr.querySelector('.st').innerHTML = nuevo.querySelector('.st').innerHTML;
  const inp = tr.querySelector('input'); if (inp.value !== g.val) inp.value = g.val;
}

function botones(){
  const mods = GROUPS.filter(g => estado(g).mod), n = mods.length, bad = mods.some(g => estado(g).bad);
  $('#bSave').disabled = !n || bad; $('#bDes').disabled = !n;
  $('#bSave').textContent = n ? `Guardar (${n})` : 'Guardar';
  $('#cMod').textContent = GROUPS.filter(g => TIPOS[g.tipo].tab === TAB && estado(g).mod).length || '';
  $('#sum').textContent = bad ? 'Hay textos no válidos: corrígelos para poder guardar' : '';
}

$('#tb').addEventListener('input', e => {
  if (!e.target.matches('input')) return;
  const tr = e.target.closest('tr'), g = VIEW[+tr.dataset.i];
  g.val = e.target.value; if (g.var) g.forzar = true;   // con variantes, tocar la fila unifica todas al valor escrito
  refrescarFila(tr); botones();
});
$('#tb').addEventListener('keydown', e => {
  if (!e.target.matches('input')) return;
  const tr = e.target.closest('tr'), g = VIEW[+tr.dataset.i];
  if (e.key === 'Escape'){ g.val = g.base; g.forzar = false; refrescarFila(tr); botones(); }
  if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const sig = e.key === 'ArrowUp' ? tr.previousElementSibling : tr.nextElementSibling;
    if (sig){ e.preventDefault(); const inp = sig.querySelector('input'); inp.focus(); inp.select(); }
  }
});
$('#tb').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const g = VIEW[+tr.dataset.i];
  if (e.target.closest('td.en') && g.en != null){
    g.val = g.en; if (g.var) g.forzar = true; refrescarFila(tr); botones();
  }
  if (e.target.closest('td.act button')){ g.val = g.base; g.forzar = false; refrescarFila(tr); botones(); }
});
$('#q').addEventListener('input', () => { clearTimeout(window._qt); window._qt = setTimeout(filtrar, 150); });
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  FILTRO = b.dataset.f; document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x === b)); filtrar();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  TAB = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); ayuda(); filtrar();
});
$('#pPrev').onclick = () => { PAGE--; pintar(); };
$('#pNext').onclick = () => { PAGE++; pintar(); };
$('#bDes').onclick = () => { if (!confirm('¿Deshacer todos los cambios sin guardar (de todas las pestañas)?')) return; for (const g of GROUPS){ g.val = g.base; g.forzar = false; } filtrar(); };
window.addEventListener('beforeunload', e => { if (pendientes()){ e.preventDefault(); e.returnValue = ''; } });

// ---------- guardar ----------
function nuevoRun(texto, cambios){
  let q = 0; RUN_RE.lastIndex = 0;
  return texto.replace(RUN_RE, (m, a, t, c) => { const k = q++; return cambios.has(k) ? a + cambios.get(k) + c : m; });
}
$('#bSave').onclick = async () => {
  const porFichero = new Map();
  for (const g of GROUPS){
    if (!estado(g).mod) continue;
    for (const [fi, j] of g.occ){
      const it = FILES[fi]; if (it.items[j].es === g.val) continue;
      if (!porFichero.has(fi)) porFichero.set(fi, []);
      porFichero.get(fi).push({ j, text: g.val });
    }
  }
  if (!porFichero.size){ for (const g of GROUPS){ g.base = g.val; g.forzar = false; } filtrar(); return; }
  let ok = 0, fallos = 0;
  for (const [fi, cambios] of porFichero){
    const it = FILES[fi];
    veil(`Guardando ${it.nombre}…`); await tick();
    try {
      let bytes;
      if (it.run){
        const m = new Map(cambios.map(c => [it.items[c.j].ref.q, c.text]));
        const t = nuevoRun(it.texto, m); bytes = CampCore.enc(t);
        if (!bytes) throw new Error('carácter no válido');
      } else {
        const obj = [], cmp = [], te = [];
        for (const c of cambios){
          const x = it.items[c.j];
          if (x.tipo === 'obj') obj.push({ off: x.ref.off, text: c.text });
          else if (x.ref.cmp != null) cmp.push({ off: x.ref.cmp, size: x.ref.size, text: c.text });
          else te.push({ idx: x.ref.te, old: x.es, text: c.text });
        }
        bytes = CampCore.save(it.f, obj, { cmp, te }).bytes;
      }
      const resp = await api(`/api/put?i=${it.fila.i}`, { method: 'POST', body: bytes });
      const js = await resp.json();
      if (!js.ok) throw new Error(js.error || 'el servidor no lo guardó');
      // se vuelve a leer lo guardado
      it.bytes = bytes;
      if (it.run){ it.texto = CampCore.dec(bytes, 0, bytes.length); it.items = itemsRun(it.texto); }
      else { it.f = CampCore.load(bytes); it.items = itemsBinario(it.f); }
      ok++; log(`Guardado ${it.fila.fich}: ${cambios.length} texto(s)` + (js.respaldo ? `  (copia previa en ${js.respaldo})` : ''));
    } catch (e) { fallos++; log(`ERROR en ${it.fila.fich}: ${e.message}`); }
  }
  veil('');
  agrupar(); filtrar();
  if (fallos) alert(`Se guardaron ${ok} fichero(s), pero ${fallos} dieron error (mira el registro).`);
  else log(`Listo: ${ok} fichero(s) guardado(s) en Ficheros.`);
};

// ---------- exportar / importar (pestaña actual) ----------
$('#bExp').onclick = () => {
  const lineas = GROUPS.filter(g => g.en != null && TIPOS[g.tipo].tab === TAB).map(g => g.en + '\t' + g.val);
  const blob = new Blob(['﻿' + lineas.join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Campana_${TEATRO}_${TAB}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  log(`Exportados ${lineas.length} textos de ${TEATRO} (${TAB}).`);
};
$('#bImp').onclick = () => $('#fImp').click();
$('#fImp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const txt = (await f.text()).replace(/^﻿/, '');
  const mapa = new Map();
  for (const l of txt.split(/\r?\n/)){ const p = l.split('\t'); if (p.length >= 2 && p[0]) mapa.set(p[0], p[1]); }
  let n = 0;
  for (const g of GROUPS){ if (TIPOS[g.tipo].tab === TAB && g.en != null && mapa.has(g.en) && mapa.get(g.en) !== g.val){ g.val = mapa.get(g.en); if (g.var) g.forzar = true; n++; } }
  filtrar(); log(`Importado ${f.name}: ${n} texto(s) cambiados (revisa y pulsa Guardar).`);
};

init();

</script>
</body>
</html>
